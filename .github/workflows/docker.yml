name: Build and publish container image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Keyless cosign signing needs `id-token: write`: with it, cosign picks up
# the ambient workflow OIDC token and signs without ever asking for browser
# interaction. Without it, the runner has no identity token to offer, so
# cosign degrades to the interactive device-flow prompt ("Non-interactive
# mode detected" → paste a human code), which a headless runner cannot
# complete. `packages: write` authorizes the default token's registry pushes
# whenever no PAT secret is set.
permissions:
  contents: read
  packages: write
  id-token: write

# Each architecture is built on its own runner by the `build` matrix job,
# pushed a single-platform manifest by digest, and the `merge` job assembles
# them into the final multi-platform manifest list. This replaces the previous
# single-job layout that built arm64 under QEMU emulation on an amd64 runner —
# the dominant cost of the workflow, since every Rust crate compiles several
# times slower under emulation. `ubuntu-24.04-arm` provides native ARM hardware
# (free for public repositories).
jobs:
  build:
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare runner-level metadata
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      # No QEMU step: `ubuntu-24.04-arm` is ARM native, `ubuntu-latest` is amd64
      # native, so each job builds its own platform at full speed.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GHCR_TOKEN (PAT with write:packages) is the way out when the org
          # "Packages → Actions permissions" setting denies the GITHUB_TOKEN
          # to CREATE an organization package, which is what the first push
          # needs. Falls back to the default token when the secret is absent.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Labels only: tags and latest semantics are applied once, in `merge`,
      # to the assembled manifest list.
      - name: Collect image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Registry cache scope is per architecture: the two matrix jobs run in
      # parallel, and concurrent writes to one scope would race.
      # `push-by-digest` publishes the single-platform manifest without a tag,
      # so nothing is reachable until `merge` assembles the manifest list.
      - name: Build and push by digest
        if: github.event_name == 'push'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: >-
            type=image,
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},
            push-by-digest=true,
            name-canonical=true,
            push=true
          # Two cache backends: the per-architecture GHA scope is fast, but
          # the shared GitHub Actions cache pool evicts entries aggressively
          # (10 GB per repo), which is what turns a run into the expensive
          # full dependency rebuild seen when the old build flipped back and
          # forth. The registry cache tag lives in GHCR alongside the image
          # and is never evicted, so a cold GHA cache still restores deps.
          cache-from: |
            type=gha,scope=build-${{ env.PLATFORM_PAIR }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: |
            type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max,ignore-error=true

      # workflow_dispatch builds for cache warm-up only, exactly as the old
      # single-job workflow (which never pushed on dispatch). Nothing is
      # published and the digest is not recorded.
      - name: Build with cache export only
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=build-${{ env.PLATFORM_PAIR }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: |
            type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max,ignore-error=true

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Referenced by digest only, so `merge` never rebuilds: it reads the two
  # single-platform manifests, turns them into one manifest list, and pushes it
  # under the tags derived from the event (version, major.minor, latest).
  merge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Same as the build job: PAT-first, default token fallback. `cosign
          # sign` reuses the credentials this step leaves in the Docker
          # config, so the signature push needs no separate token.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

      # Make the published package public right after the push. Container
      # packages created by Actions are born private (or Internal on orgs),
      # which makes unauthenticated `docker pull` fail 401; the visibility is
      # per-package, so once this PATCH succeeds every later push keeps it
      # public. Needs a token with packages scope: the org-blocked GITHUB_TOKEN
      # case is why GHCR_TOKEN is preferred, exactly as for the login step.
      - name: Publish package as public
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          name=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          gh api \
            --method PATCH "orgs/$owner/packages/container/$name" \
            -f visibility=public
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://ghcr.io/v2/$owner/$name/manifests/latest")
          echo "Anonymous manifest probe: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Package may not be public: anonymous probe returned $code"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless (OIDC) signature over the published manifest-list digest, so
      # anyone pulling from GHCR can verify the image was built by this
      # workflow. `cosign sign` requires a digest reference; the digest of the
      # manifest list is the sha256 of its raw bytes, which `--raw` returns.
      # `cosign verify ghcr.io/<repo>@<digest> --certificate-identity-regexp '.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com`
      - name: Sign image
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect --raw "${REF}" | sha256sum | cut -d' ' -f1)
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${digest}"
